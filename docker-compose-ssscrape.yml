services:
    mysql:
        image: mariadb:11
        command: --lower-case-table-names=2 --sql-mode=""
        healthcheck:
#            test: mariadb-admin ping -u root -p ${MYSQL_PASSWORD}
            test: mariadb ogn --user=root --password='${MYSQL_PASSWORD}' --silent --execute "SELECT 1;"
            interval: 10s
            timeout: 10s
            retries: 10
        environment:
            MYSQL_ROOT_PASSWORD: '$MYSQL_PASSWORD'
        volumes:
            - ./conf/sql/docker:/docker-entrypoint-initdb.d
    ogn-next:
        image: ogn-next:${DOCKER_TAG:-latest}
        build:
            context: .
            dockerfile: ./conf/Dockerfile
            target: ogn-next
            args:
                ENV_FILE:  ".env${DOCKER_TAG:+.${DOCKER_TAG}}"
                NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN?Mapbox token must be set}
                NEXT_PUBLIC_SITEURL: ${NEXT_PUBLIC_SITEURL}
                NEXT_PUBLIC_WEBSOCKET_HOST: $NEXT_PUBLIC_WEBSOCKET_HOST
                NEXT_PUBLIC_HISTORY_HOST: $NEXT_PUBLIC_HISTORY_HOST
                NEXT_PUBLIC_COMPETITION_DELAY: ${NEXT_PUBLIC_COMPETITION_DELAY:-0}
                NEXT_PUBLIC_REPLAY: ${NEXT_PUBLIC_REPLAY}
                MYSQL_PASSWORD: $MYSQL_PASSWORD
                MYSQL_HOST: mysql
                MYSQL_USER: root
                MYSQL_DATABASE: ogn
        command: yarn next start
        platform: 'linux/amd64'
        depends_on:
            mysql:
                condition: service_healthy
        ports:
            - 3000:3000
        environment:
            ENV_FILE:  ".env${DOCKER_TAG:+.${DOCKER_TAG}}"
            MYSQL_PASSWORD: $MYSQL_PASSWORD
            MYSQL_HOST: mysql
            MYSQL_USER: root
            MYSQL_DATABASE: ogn
            NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN?Mapbox token must be set}
            NEXT_PUBLIC_COMPETITION_DELAY: ${NEXT_PUBLIC_COMPETITION_DELAY:-0}
            NEXT_PUBLIC_WEBSOCKET_HOST: $NEXT_PUBLIC_WEBSOCKET_HOST
            NEXT_PUBLIC_HISTORY_HOST: ${NEXT_PUBLIC_HISTORY_HOST:-${NEXT_PUBLIC_WEBSOCKET_HOST}}
            NEXT_PUBLIC_REPLAY: ${NEXT_PUBLIC_REPLAY}
        restart: always
    ogn-ogn:
        image: ogn-ogn:${DOCKER_TAG:-latest}
        build:
            target: ogn-ogn
            dockerfile: ./conf/Dockerfile
        command: node bin/ogn
        platform: 'linux/amd64'
        depends_on:
            mysql:
                condition: service_healthy
        restart: always
        environment:
            ENV_FILE:  ".env${DOCKER_TAG:+.${DOCKER_TAG}}"
            DOCKER_TAG: ${DOCKER_TAG}   
            MYSQL_PASSWORD: $MYSQL_PASSWORD
            MYSQL_HOST: mysql
            MYSQL_USER: root
            MYSQL_DATABASE: ogn
            NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: $NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN
            NEXT_PUBLIC_SITEURL: $NEXT_PUBLIC_SITEURL
            NEXT_PUBLIC_COMPETITION_DELAY: ${NEXT_PUBLIC_COMPETITION_DELAY:-0}
            NEXT_PUBLIC_REPLAY: ${NEXT_PUBLIC_REPLAY}
            API_HOSTNAME: next:3000
        ports:
            - 8080:8080
        volumes:
            - ./db:/onglide/db
            - ./keys:/onglide/keys
    ogn-soaringspot:
        image: ogn-soaringspot:${DOCKER_TAG:-latest}
        build:
            dockerfile: ./conf/Dockerfile
            target: ogn-soaringspot
        # bin/soaringspot.ts was replaced by the scoring scheduler in
        # bin/ssscrape.ts. Service name kept for back-compat.
        command: node bin/ssscrape
        platform: 'linux/amd64'
        depends_on:
            mysql:
                condition: service_healthy
        restart: always
        environment:
            ENV_FILE:  ".env${DOCKER_TAG:+.${DOCKER_TAG}}"
            DOCKER_TAG: ${DOCKER_TAG}   
            MYSQL_PASSWORD: $MYSQL_PASSWORD
            MYSQL_HOST: mysql
            MYSQL_USER: root
            MYSQL_DATABASE: ogn
            NEXT_PUBLIC_SITEURL: $NEXT_PUBLIC_SITEURL
            SOARINGSPOT_URL: ${SOARINGSPOT_URL?SoaringSpot URL not set}
            SOARINGSPOT_OVERWRITE: ${SOARINGSPOT_OVERWRITE:-1}
            SOARINGSPOT_ACTUALS: ${SOARINGSPOT_ACTUALS:-1}
    ogn-apache:
        image: ogn-apache:${DOCKER_TAG:-latest}
        platform: 'linux/amd64'
        build:
            context: ./conf/apache
            target: ogn-apache
        restart: always
        command: httpd-foreground -D${ONGLIDE_SSL-NO_ONGLIDE_SSL}
        tty: true
        stdin_open: true
        depends_on:
            - ogn-next
            - ogn-ogn
        ports:
            - 8080:80
            - 8443:8443
        environment:
            NEXT_PUBLIC_SITEURL: ${NEXT_PUBLIC_SITEURL?URL for the site is not set}
            SERVER_ADMIN: $SERVER_ADMIN
