syntax = "proto3";
//import "google/protobuf/any.proto";

message OnglideWebSocketMessage {
	optional Identifiers identifiers = 7;
    optional PilotTracks tracks = 1;
    optional Scores scores = 2;
	optional ClassPositions positions = 6;
    optional KeepAlive ka = 4;
    optional uint32 t = 5;
    optional Task task = 8;
    optional CompetitionsList competitions = 9;
}

// Winner of a flown day — populated for /all CompetitionClassStatus when
// displayStatus is 'home' or 'yesterday' and the class has scored at least
// one pilot. Speed/distance are taken from the leading pilot's handicapped
// score: taskSpeed if any pilot has one, otherwise taskDistance.
message ClassWinner {
	string compno = 1;
	optional double taskSpeed = 2;     // km/h, handicapped (preferred for display)
	optional double taskDistance = 3;  // km, handicapped (shown when no speed)
}

// Per-class status row shown on the globe landing page; mirrors the JSON
// previously returned by /api/competitions.
message CompetitionClassStatus {
	string class = 1;            // classid
	string classname = 2;
	string status = 3;           // raw compstatus.status (L/S/H/F/B/P/G/'')
	uint32 pilotCount = 4;
	optional string statusDatecode = 5;
	string displayStatus = 6;    // matches CompetitionDisplayStatus union in TS
	optional TaskRules taskRules = 7;  // when a task is briefed, full rules; pre-task, a stub carrying handicapped/dh from the classes table
	optional string datecode = 8;      // per-class WS-channel datecode (10am-local cutoff)
	optional TaskDetails taskDetails = 9;  // current day's task; FE picks distance (speed task) or duration (AAT)
	optional ClassWinner winner = 10;      // home/yesterday with at least one score
}

message CompetitionSummary {
	string compid = 1;
	string name = 2;
	optional string sitename = 3;
	double lat = 4;
	double lng = 5;
	string start = 6;            // YYYY-MM-DD
	string end = 7;              // YYYY-MM-DD
	string countrycode = 8;
	string tz = 9;
	int32 tzoffset = 10;
	optional string mainwebsite = 11;
	optional string urllogo = 17;
	uint32 classCount = 12;
	bool classStatusesDiffer = 13;
	string displayStatus = 14;
	repeated CompetitionClassStatus classes = 15;
	optional uint32 officialDelay = 16; // seconds; resolved from competition.delayseconds with NEXT_PUBLIC_COMPETITION_DELAY fallback
}

// Pushed to clients of the reserved /all channel. On initial connect the
// server sends `full=true` with every active competition. Subsequent frames
// are deltas: `competitions` lists only changed comps, `removed` lists comp
// ids that have dropped off the live list (end date passed).
message CompetitionsList {
	repeated CompetitionSummary competitions = 1;
	uint32 generatedAt = 2;
	bool full = 3;
	repeated string removed = 4;
}

message Identifiers {
	string className = 1;
	string datecode = 2;
	string competition = 3;
	optional uint32 earliestScore = 4;
	optional uint32 latestScore = 5;
	optional string scoreId = 6;
	optional uint32 meanAgl = 7;
	optional uint32 highestAgl = 8;
	optional uint32 deviationAgl = 9;
}

message TaskRules {
	bool grandprixstart = 1;
	uint32 nostartutc = 2;          // Epoch
	optional bool aat = 3;
	optional bool dh = 4;            // distance handicap
	optional bool handicapped = 5;
	optional double dm = 6;          // minimum distance for non-AAT speed tasks
	double maxHandicap = 7; // highest handicap in the class (may be fractional, e.g. Polish handicaps); absent if class has no handicaps
}

message TaskDetails {
	string type = 1;                 // 'S' | 'D' | 'E' | 'A'
	double distance = 2;             // task distance in km
	string duration = 3;             // 'HH:MM:SS' (AAT)
	string status = 4;               // 'Z' = scrubbed, etc
	string nostart = 5;              // 'HH:MM:SS' start-open string
	optional string info = 6;
	optional string calendardate = 7;
	optional uint32 taskid = 8;      // diagnostic
	optional string hash = 9;        // diagnostic
}

// Per-leg fields the frontend needs. Includes the full geometric inputs
// (type, r1/r2, a1/a2/a12, direction, altitude) because the client re-runs
// calculateTask() via adjustDistanceHandicapTask() for DH classes.
// Server-computed artefacts (per-leg geoJSON / coordinates / lineString /
// point / pointGeoJSON / maxR / quickSector / legDistanceAdjust / finish)
// are NOT sent — they get rebuilt on the client when needed.
message TaskLeg {
	uint32 legno = 1;
	string type = 2;                 // 'line' | 'sector'
	string ntrigraph = 3;
	string name = 4;
	double bearing = 5;
	double length = 6;               // km
	double nlat = 7;
	double nlng = 8;
	double r1 = 9;                   // km
	double r2 = 10;                  // km
	double a1 = 11;                  // degrees (half-angle)
	double a2 = 12;                  // degrees
	double a12 = 13;                 // bearing
	string direction = 14;           // 'symmetrical' | 'np' | 'pp' | 'fixed'
	optional double altitude = 15;
}

message Task {
	optional bool startOpen = 3;
	optional string geoJSON = 1;     // {tp, track, Dm?} FeatureCollection bundle for deck.gl
	reserved 2;                      // was: string taskJSON
	reserved "taskJSON";
	optional TaskRules rules = 4;
	optional TaskDetails details = 5;
	repeated TaskLeg legs = 6;
}


message PilotTracks {
    map<string, PilotTrack> pilots = 1;
	uint32	baseTime = 2;
};


message ScoreHistory {
	repeated PilotScore history = 4;
}

message ClassScoreHistory {
	string className = 1;
	string datecode = 2;
	map<string,ScoreHistory> pilots = 4; // 
}
	

message PilotTrack {
    // what pilot
    string compno = 1;

    // number of points
    uint32 posIndex = 2;

    // epoch time for each point (actually uint32)
    optional bytes t = 3;

    // Three tuple of [lat,lng,alt] repeated length times (actually float) (and the height above ground)
    optional bytes positions = 4;
		
    // For colouring, all Uint8 arrays one for each point all optional
	optional bytes climbRate = 8;
	//    bytes airSpeed = 9;
	//    bytes altitudeBand = 10;
	//    bytes leg = 11;

    optional bytes agl = 12; // int16
	
	// This changes if we need to replace the pilot track
	uint32 trackVersion = 13;
};

message Scores {
	string scoreId = 6;
    map<string,PilotScore> pilots = 1;
}

message SpeedDist {
    optional double distance = 1; // done distance on this leg
	double taskDistance = 2; // done distance on whole task

    optional double distanceRemaining = 11; // Speed
    optional double maxPossible = 12; // AAT
    optional double minPossible = 13;

    optional uint32 grRemaining = 20;

    optional double legSpeed = 30; // speed on this leg
    optional double taskSpeed = 31; // speed on task to end of leg
}

message PilotScoreLeg {
    uint32 legno = 1;
    uint32 time = 2;
	optional uint32 duration = 3; // time from previous point to this one 
	optional uint32 taskDuration = 4; // time from start to this

	optional BasePositionMessage point = 5;

    optional uint32 alt = 6;
    optional uint32 agl = 7;

    optional bool   estimatedEnd = 8;
    optional bool   estimatedStart = 9;
    optional bool   inPenalty = 10;

	// Scores
    optional SpeedDist handicapped = 11;
    optional SpeedDist actual = 12;

	// considered points, only dev mode
	repeated float convexHull = 13; // [packed= true];
}

message Wind {
    uint32 speed = 1;
    uint32 direction = 2;
}

//
// A segment of the flight
message StatSegment {
    uint32 start = 1; // Epoch
    uint32 end = 2; // Epoch
    string state = 3; // Type of segment
    Wind wind = 4; // Wind for segment
    uint32 turncount = 5; // Number of turns
    double distance = 6; // Distance (ground not task)
    double achievedDistance = 7; // From first point to last point - straight
    int32 delta = 8; // height delta?
    double avgDelta = 9;
    uint32 direction = 10; // left or right
    uint32 heightgain = 11; // gain m
    uint32 heightloss = 12; // loss m
}

message Stats {
	repeated StatSegment segments = 1;
}

message BasePositionMessage {
	uint32 t = 1;
	float lat = 2;
	float lng = 3;
}

//
// Scores for each pilot
message PilotScore {
    // timestamp
	bool live = 13; // recent
    uint32 t = 1;

    // Pilot details
    string compno = 2;

    // Start/Finish details
    uint32 utcStart = 3;
    uint32 utcFinish = 4;
	optional uint32 taskDuration = 5; // scored to when
	optional int32 taskTimeRemaining = 54; // how many seconds remaining on an aat, will be negative if under time
	
	//    bool startFound = 6;
	optional bool inSector = 7;
	optional bool inPenalty = 8;
	optional bool stationary = 9;

	// What phase of flight (see PositionStatus in types.ts)
	optional uint32 flightStatus = 12;

    // Scores
    optional SpeedDist actual = 10;
    optional SpeedDist handicapped = 11;

	// Home (partial data only, and actuals only)
	optional SpeedDist home = 62; // how many km to home
	
    // Leg details
    uint32 currentLeg = 37;
    map<uint32,PilotScoreLeg> legs = 36;

    // If we are generating statistics then include that
    optional Stats stats = 43;
    optional Wind wind = 56;


    // List of points [x,y,actualDistance,hcapDistance,x,y,actualDistance,hcapDistance,x,y,actualDistance,hcapDistance]
    repeated float scoredPoints = 52;
    repeated float minDistancePoints = 60;
    repeated float maxDistancePoints = 61;

    // The point used for scoring on the uncompleted leg (nearest boundary for AAT, pilot position for racing landout)
    optional BasePositionMessage scoringClosestPoint = 63;

    // Optimal point in next sector that maximises total distance (for AAT direction visualization)
    optional BasePositionMessage optimalNextSectorPoint = 64;

    // Grid of optimal task distances per cell [lng, lat, taskDist, ...] for AAT direction heatmap
    repeated float optimalGrid = 65;

    // Live baseline: scored distance to current sector point + max remaining forward
    optional float optimalGridBaseline = 67;

    // Baseline path visualization [lng, lat, ...] from start through scored points + max remaining to finish
    repeated float optimalGridBaselinePath = 68;

    // Suggested track aim points [lng, lat, dist, hdist, ...] for AAT remaining sectors
    repeated float suggestedTrackPoints = 69;

    // For DH we have a specific task for the pilot
	//    optional string taskGeoJSON = 53;

	// For rescoring
    optional string scoreId = 55;
}

//
// This message is generate position updates for the pilots
message PilotPosition {
    string c = 1;
    double lat = 2;
    double lng = 3;
    sint32 a = 4; // AMSL — can be negative near sea level
    sint32 g = 5; // AGL — terrain-model imprecision can push below 0
    uint32 t = 6;
    uint32 b = 7;
    uint32 s = 8;
}

message Positions {
	repeated PilotPosition positions=1;
}

message ClassPositions {
	map<string,Positions> class=1;
}

//
// Are we connected?
message KeepAlive {
    bool keepalive = 1;
    uint32 at = 3;
    uint32 listeners = 4;
    uint32 airborne = 5;
}
